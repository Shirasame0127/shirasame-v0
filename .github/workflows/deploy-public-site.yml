name: Build and Deploy public-site to Cloudflare Pages

# Cloudflare Pages builds and deploys this project directly from `main` through
# its own GitHub integration (project `shirasame-box`, root `public-site`), so
# this workflow is a second, competing publisher of the same commit. Kept for
# manual use — e.g. republishing without a push — but no longer runs on push.
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@8

      - name: Install dependencies
        working-directory: public-site
        run: pnpm install

      - name: Build public-site (Next)
        working-directory: public-site
        run: pnpm run build

      # next-on-pages writes to .vercel/output/static; it has no --output flag.
      - name: Build for Pages using next-on-pages
        working-directory: public-site
        run: pnpm dlx @cloudflare/next-on-pages@1

      # Secret names here must match what the repository actually holds:
      # CF_API_TOKEN / CF_ACCOUNT_ID / CF_PROJECT_NAME. Wrangler reads the
      # CLOUDFLARE_* environment variables, hence the remapping.
      - name: Publish to Cloudflare Pages
        working-directory: public-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PROJECT_NAME: ${{ secrets.CF_PROJECT_NAME }}
        run: |
          if [ -z "$PROJECT_NAME" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CF_PROJECT_NAME / CF_API_TOKEN secrets are not set; cannot publish." >&2
            exit 1
          fi
          npx wrangler@3 pages deploy .vercel/output/static --project-name "$PROJECT_NAME" --branch main

      - name: Done
        run: echo "public-site deployed via Pages workflow"
