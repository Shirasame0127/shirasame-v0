name: Deploy public-worker

on:
  push:
    branches: [ main ]

jobs:
  publish:
    name: Publish public-worker to Cloudflare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: public-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show runner info
        run: |
          echo "=== runner info ==="
          uname -a || true
          node -v || true
          pnpm -v || true
          echo "PWD: $(pwd)"

      - name: Install public-worker dependencies
        run: pnpm install --no-frozen-lockfile

      # Wrangler authenticates from CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID,
      # not CF_*, so the repository secrets are remapped onto those names.
      - name: Publish with wrangler CLI
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CF_API_TOKEN secret is not set; cannot deploy." >&2
            exit 1
          fi
          npx --yes wrangler@3 deploy
